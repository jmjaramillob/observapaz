services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-observapaz}
      POSTGRES_USER: ${DB_USER:-observapaz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-observapaz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: unless-stopped
    command: gunicorn observapaz.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  postgres_data:
  static_volume:
